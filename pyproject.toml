[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aetheric-geometry"
version = "1.0.0"
description = "Real-time hand-gesture instrument: geometry drawn in the air becomes just-intonation sound."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[tool.setuptools]
packages = ["aetheric"]

[tool.pytest.ini_options]
# Run the suite from the repo root: `pytest`
pythonpath = ["."]
testpaths = ["tests"]
